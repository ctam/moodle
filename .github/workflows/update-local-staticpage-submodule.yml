name: Update submodules based on tracked branches and tags

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: UCSFCLE_501_STABLE
  IGNORE_LIST: |
    public/availability/condition/mobileapp
    public/lib/editor/tiny/plugins/fontcolor

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          submodules: true
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Process submodules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "$IGNORE_LIST" > ignore.txt

          BASE_BRANCH="${BASE_BRANCH}"

          git config -f .gitmodules --get-regexp path | while read -r key path; do
            echo "-----------------------------"
            echo "Processing $path"

            # Ignore check
            if grep -qx "$path" ignore.txt; then
              echo "Skipping $path (ignored)"
              continue
            fi

            # Extract submodule name
            name=$(echo "$key" | sed -E 's/submodule\.(.*)\.path/\1/')

            BRANCH=$(git config -f .gitmodules --get submodule.$name.branch || true)
            CURRENT_TAG=$(git config -f .gitmodules --get submodule.$name.tag || true)

            if [[ -z "$BRANCH" || -z "$CURRENT_TAG" ]]; then
              echo "Skipping $path (missing branch or tag)"
              continue
            fi

            echo "Branch: $BRANCH"
            echo "Current tag: $CURRENT_TAG"

            # Fetch latest branch
            cd "$path"
            git fetch origin "$BRANCH"

            LATEST_TAG=$(git tag --merged origin/"$BRANCH" --sort=-v:refname | head -n1)
            cd -

            echo "Latest tag: $LATEST_TAG"

            if [[ -z "$LATEST_TAG" ]]; then
              echo "No tags found on branch, skipping"
              continue
            fi

            if [[ "$CURRENT_TAG" == "$LATEST_TAG" ]]; then
              echo "No update needed"
              continue
            fi

            BRANCH_NAME="update-$(echo $path | tr '/' '-')-$LATEST_TAG"

            echo "Preparing branch $BRANCH_NAME"

            # Always reset to base branch cleanly
            git checkout "$BASE_BRANCH"
            git pull origin "$BASE_BRANCH"

            # Skip if branch already exists remotely
            if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
              echo "Branch $BRANCH_NAME already exists, skipping"
              continue
            fi

            git checkout -b "$BRANCH_NAME"

            # Update submodule
            git submodule update --remote "$path"

            cd "$path"
            git checkout "$LATEST_TAG"
            cd -

            # Update .gitmodules
            git config -f .gitmodules submodule.$name.tag "$LATEST_TAG"

            git add "$path" .gitmodules
            git commit -m "Update $path to $LATEST_TAG"

            git push origin "$BRANCH_NAME"

            # Create PR with explicit base
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "Update $path to $LATEST_TAG" \
              --body "Updates submodule \`$path\` from \`$CURRENT_TAG\` to \`$LATEST_TAG\`." \
              || {
                echo "Failed to create PR"
                exit 1
              }
          done
