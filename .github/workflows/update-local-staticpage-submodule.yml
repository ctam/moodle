name: Update staticpage submodule

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-submodule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Extract current tag
        id: current
        run: |
          TAG=$(git config -f .gitmodules --get submodule.public/local/staticpage.tag)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Extract branch from .gitmodules
        id: branch
        run: |
          BRANCH=$(git config -f .gitmodules --get submodule.public/local/staticpage.branch)
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Fetch submodule branch
        run: |
          cd public/local/staticpage
          git fetch origin ${{ steps.branch.outputs.branch }}

      - name: Get latest tag on branch
        id: latest
        run: |
          cd public/local/staticpage
          TAG=$(git tag --merged origin/${{ steps.branch.outputs.branch }} --sort=-v:refname | head -n1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compare tags
        id: compare
        run: |
          if [ "${{ steps.current.outputs.tag }}" != "${{ steps.latest.outputs.tag }}" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
          else
            echo "update=false" >> $GITHUB_OUTPUT
          fi

      - name: Update submodule and tag
        if: steps.compare.outputs.update == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout -b update-staticpage-${{ steps.latest.outputs.tag }}

          git submodule update --remote public/local/staticpage

          cd public/local/staticpage
          git checkout ${{ steps.latest.outputs.tag }}
          cd -

          git config -f .gitmodules submodule.public/local/staticpage.tag ${{ steps.latest.outputs.tag }}

          git add .gitmodules public/local/staticpage
          git commit -m "Update staticpage to ${{ steps.latest.outputs.tag }}"

      - name: Create PR
        if: steps.compare.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: update-staticpage-${{ steps.latest.outputs.tag }}
          title: "Update staticpage to ${{ steps.latest.outputs.tag }}"
          body: |
            Updates submodule `public/local/staticpage` to `${{ steps.latest.outputs.tag }}`.