name: Sync Moodle Minor Releases

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  MOODLE_VERSION: "4.5"
  UPSTREAM_BRANCH: MOODLE_405_STABLE
  TARGET_BRANCH: UCSFCLE_405_STABLE

jobs:
  sync:
    name: >
      Moodle ${{ env.MOODLE_VERSION }} Sync:
      ${{ env.UPSTREAM_BRANCH }} → ${{ env.TARGET_BRANCH }}
    uses: ./.github/workflows/sync-moodle-minor-releases-reusable.yml

    with:
      upstream_branch: ${{ env.UPSTREAM_BRANCH }}
      target_branch: ${{ env.TARGET_BRANCH }}

      # ----------------------------------------------------------
      # People metadata (optional GitHub PR assignment behavior)
      # ----------------------------------------------------------
      assignees: ctam
      reviewers: ucsf-education/moodlecodereviewers
