name: Reusable Moodle Minor Release Sync

on:
  workflow_call:
    inputs:
      upstream_branch:
        required: true
        type: string
      target_branch:
        required: false
        type: string
      assignees:
        required: false
        type: string
      reviewers:
        required: false
        type: string

jobs:
  sync:
    name: Merge upstream Moodle minor release
    runs-on: ubuntu-latest

    env:
      # Force newer Node runtime for actions (future-proofing)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # Inputs
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}

    steps:
      # ------------------------------------------------------------
      # Debug context (helps when workflow is reused in different repos)
      # ------------------------------------------------------------
      - name: Debug branch resolution
        run: |
          echo "TARGET_BRANCH=$TARGET_BRANCH"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"

      # ------------------------------------------------------------
      # Checkout target branch with full history (needed for tag + merge logic)
      # ------------------------------------------------------------
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      # ------------------------------------------------------------
      # Configure git identity for commits created by this workflow
      # ------------------------------------------------------------
      - name: Configure git identity
        run: |
          # GitHub Actions bot identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------------------
      # Add upstream Moodle repo and fetch everything needed
      # ------------------------------------------------------------
      - name: Add upstream + fetch
        run: |
          git remote add upstream https://github.com/moodle/moodle.git

          # Fetch all branches + tags so merge-base + tag filtering works reliably
          git fetch upstream "+refs/heads/*:refs/remotes/upstream/*" --tags

      # ------------------------------------------------------------
      # Convert MOODLE_405_STABLE → v4.5.*
      # Used to filter only relevant release tags
      # ------------------------------------------------------------
      - name: Derive allowed version prefix
        id: version
        run: |
          RAW=$(echo "$UPSTREAM_BRANCH" | sed -E 's/MOODLE_([0-9]{3})_STABLE/\1/')
          MAJOR=$(echo "$RAW" | cut -c1)
          MINOR=$(echo "$RAW" | cut -c2-3 | sed 's/^0//')

          PREFIX="v${MAJOR}.${MINOR}."

          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "Using tag prefix: $PREFIX"

      # ------------------------------------------------------------
      # Find latest upstream tag that:
      # - matches version prefix
      # - exists on the upstream stable branch
      # ------------------------------------------------------------
      - name: Find latest valid tag
        id: latest_tag
        run: |
          PREFIX=${{ steps.version.outputs.prefix }}

          TAG=$(git tag \
            --merged upstream/$UPSTREAM_BRANCH \
            --list "${PREFIX}*" \
            --sort=-v:refname | head -n 1)

          if [ -z "$TAG" ]; then
            echo "No matching tag found" >&2
            exit 1
          fi

          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $TAG"

      # ------------------------------------------------------------
      # Sanity check: ensure tag is actually on the upstream branch
      # ------------------------------------------------------------
      - name: Verify tag ancestry
        run: |
          TAG=${{ steps.latest_tag.outputs.latest_tag }}

          git merge-base --is-ancestor "$TAG" "upstream/$UPSTREAM_BRANCH" || {
            echo "Tag $TAG is NOT on $UPSTREAM_BRANCH"
            exit 1
          }

      # ------------------------------------------------------------
      # Skip if already merged
      # ------------------------------------------------------------
      - name: Check if already merged
        id: check
        run: |
          git checkout $TARGET_BRANCH

          TAG=${{ steps.latest_tag.outputs.latest_tag }}

          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "already_merged=true" >> $GITHUB_OUTPUT
            echo "Tag already merged"
          else
            echo "already_merged=false" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------
      # Determine current version in target branch (for PR title)
      # ------------------------------------------------------------
      - name: Get current merged version
        id: current_tag
        run: |
          PREFIX=${{ steps.version.outputs.prefix }}

          CURRENT=$(git tag \
            --merged HEAD \
            --list "${PREFIX}*" \
            --sort=-v:refname | head -n 1)

          echo "current_tag=${CURRENT:-none}" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Ensure clean working tree before merge
      # ------------------------------------------------------------
      - name: Reset working tree
        run: |
          git checkout $TARGET_BRANCH
          git reset --hard
          git clean -fd

      # ------------------------------------------------------------
      # Merge upstream tag
      # - Detect workflow changes
      # - Revert them to avoid GitHub permission errors
      # ------------------------------------------------------------
      - name: Merge upstream tag
        if: steps.check.outputs.already_merged == 'false'
        id: merge
        run: |
          TAG=${{ steps.latest_tag.outputs.latest_tag }}

          git merge $TAG --no-edit || {
            echo "Merge conflict detected"
            exit 1
          }

          # Detect workflow changes introduced by upstream
          if git diff --name-only ORIG_HEAD HEAD | grep -q "^.github/workflows/"; then
            echo "workflow_changed=true" >> $GITHUB_OUTPUT

            # Revert workflow changes to avoid GitHub permission issues
            git checkout ORIG_HEAD -- .github/workflows
            git add .github/workflows
            git commit -m "Revert upstream workflow changes"
          else
            echo "workflow_changed=false" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------
      # Build optional warning message for PR body
      # ------------------------------------------------------------
      - name: Build workflow warning message
        id: workflow_msg
        run: |
          if [ "${{ steps.merge.outputs.workflow_changed }}" = "true" ]; then
            {
              echo "message<<EOF"
              echo "---"
              echo "⚠️ **Workflow Changes Detected (Ignored)**"
              echo ""
              echo "Upstream changes to \`.github/workflows/\` were NOT merged."
              echo ""
              echo "Review changes:"
              echo "\`\`\`bash"
              echo "git fetch upstream"
              echo "git diff ${{ env.TARGET_BRANCH }} ${{ steps.latest_tag.outputs.latest_tag }} -- .github/workflows"
              echo "\`\`\`"
              echo ""
              echo "Merge manually if needed:"
              echo "\`\`\`bash"
              echo "git checkout ${{ env.TARGET_BRANCH }}"
              echo "git merge ${{ steps.latest_tag.outputs.latest_tag }}"
              echo "\`\`\`"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "message=" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------
      # Compute labels dynamically
      # ------------------------------------------------------------
      - name: Set labels
        id: labels
        run: |
          if [ "${{ steps.merge.outputs.workflow_changed }}" = "true" ]; then
            echo "labels=moodle-core,upstream-workflow-change" >> $GITHUB_OUTPUT
          else
            echo "labels=moodle-core" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------
      # Create or update PR
      # ------------------------------------------------------------
      - name: Create Pull Request
        if: steps.check.outputs.already_merged == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: Merge-Moodle-${{ steps.latest_tag.outputs.latest_tag }}
          base: ${{ env.TARGET_BRANCH }}

          title: >
            Update to Moodle ${{ steps.latest_tag.outputs.latest_tag }}
            from ${{ steps.current_tag.outputs.current_tag }}

          body: |
            Automated Moodle upgrade

            **From:** `${{ steps.current_tag.outputs.current_tag }}`
            **To:** `${{ steps.latest_tag.outputs.latest_tag }}`
            **Upstream branch:** `${{ env.UPSTREAM_BRANCH }}`

            ${{ steps.workflow_msg.outputs.message }}

          commit-message: |
            Update Moodle to ${{ steps.latest_tag.outputs.latest_tag }}

          assignees: ${{ inputs.assignees }}
          reviewers: ${{ inputs.reviewers }}

          labels: ${{ steps.labels.outputs.labels }}
