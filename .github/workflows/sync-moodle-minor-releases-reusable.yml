name: Reusable Moodle Release Sync

on:
  workflow_call:
    inputs:
      upstream_branch:
        required: true
        type: string
      target_branch:
        required: false
        type: string
      assignees:
        required: false
        type: string
      reviewers:
        required: false
        type: string
jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}

    steps:
      - name: Debug branch resolution
        run: |
          echo "Resolved TARGET_BRANCH=$TARGET_BRANCH"
          echo "Workflow running on ref=${GITHUB_REF_NAME}"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Configure git identity
        run: |
          # 41898282 is GitHub's internal user ID for github-actions[bot],
          # used with the noreply email to attribute commits to the Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream + fetch tags
        run: |
          git remote add upstream https://github.com/moodle/moodle.git
          git fetch upstream "+refs/heads/*:refs/remotes/upstream/*" --tags

      - name: Derive allowed version prefix
        id: version
        run: |
          RAW=$(echo "$UPSTREAM_BRANCH" | sed -E 's/MOODLE_([0-9]{3})_STABLE/\1/')
          MAJOR=$(echo "$RAW" | cut -c1)
          MINOR=$(echo "$RAW" | cut -c2-3 | sed 's/^0//')

          PREFIX="v${MAJOR}.${MINOR}."
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "Allowed prefix: $PREFIX"

      - name: Find latest valid tag on branch
        id: latest_tag
        run: |
          PREFIX=${{ steps.version.outputs.prefix }}

          TAG=$(git tag \
            --merged upstream/$UPSTREAM_BRANCH \
            --list "${PREFIX}*" \
            --sort=-v:refname | head -n 1)

          if [ -z "$TAG" ]; then
            echo "No matching tag found!" >&2
            exit 1
          fi

          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Verify tag is on branch
        run: |
          TAG=${{ steps.latest_tag.outputs.latest_tag }}

          if ! git merge-base --is-ancestor "$TAG" "upstream/$UPSTREAM_BRANCH"; then
            echo "Tag $TAG is NOT on $UPSTREAM_BRANCH" >&2
            exit 1
          fi

      - name: Check if already merged
        id: check
        run: |
          git checkout $TARGET_BRANCH
          TAG=${{ steps.latest_tag.outputs.latest_tag }}

          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "already_merged=true" >> $GITHUB_OUTPUT
          else
            echo "already_merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Get current merged version
        id: current_tag
        run: |
          PREFIX=${{ steps.version.outputs.prefix }}

          CURRENT=$(git tag \
            --merged HEAD \
            --list "${PREFIX}*" \
            --sort=-v:refname | head -n 1)

          if [ -z "$CURRENT" ]; then
            CURRENT="none"
          fi

          echo "current_tag=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current tag: $CURRENT"

      - name: Ensure clean working tree
        run: |
          git checkout $TARGET_BRANCH
          git reset --hard
          git clean -fd

      - name: Merge tag into working tree
        if: steps.check.outputs.already_merged == 'false'
        run: |
          TAG=${{ steps.latest_tag.outputs.latest_tag }}
          git merge $TAG --no-edit
          # Prevent upstream from modifying your workflows
          git checkout HEAD -- .github/workflows

      - name: Merge tag into working tree
        if: steps.check.outputs.already_merged == 'false'
        id: merge
        run: |
          TAG=${{ steps.latest_tag.outputs.latest_tag }}

          git merge $TAG --no-edit

          # Detect if workflows changed
          if git diff --name-only HEAD~1 HEAD | grep -q "^.github/workflows/"; then
            echo "workflow_changed=true" >> $GITHUB_OUTPUT
          else
            echo "workflow_changed=false" >> $GITHUB_OUTPUT
          fi

          # Revert workflow changes
          git checkout HEAD -- .github/workflows

        - name: Build workflow warning message
          id: workflow_msg
          run: |
            if [ "${{ steps.merge.outputs.workflow_changed }}" = "true" ]; then
              cat <<EOF >> $GITHUB_OUTPUT
        message=---
        ⚠️ **Workflow Changes Detected (Ignored)**
        
        Upstream changes to \`.github/workflows/\` were detected and intentionally **NOT merged**.
        
        If you want to review them:
        
        \`\`\`bash
        git fetch upstream
        git checkout ${{ steps.latest_tag.outputs.latest_tag }}
        git diff HEAD .github/workflows
        \`\`\`
        
        To merge them manually:
        
        \`\`\`bash
        git checkout ${{ env.TARGET_BRANCH }}
        git merge ${{ steps.latest_tag.outputs.latest_tag }}
        \`\`\`
        EOF
            else
              echo "message=" >> $GITHUB_OUTPUT
            fi
    
      - name: Create Pull Request
        if: steps.check.outputs.already_merged == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: Merge-Moodle-${{ steps.latest_tag.outputs.latest_tag }}
          base: ${{ env.TARGET_BRANCH }}

          title: >
            Update to Moodle ${{ steps.latest_tag.outputs.latest_tag }}
            from ${{ steps.current_tag.outputs.current_tag }}

          body: |
            Automated Moodle upgrade
          
            **From:** `${{ steps.current_tag.outputs.current_tag }}`
            **To:** `${{ steps.latest_tag.outputs.latest_tag }}`
            **Upstream branch:** `${{ env.UPSTREAM_BRANCH }}`
          
            This PR merges the upstream release tag into `${{ env.TARGET_BRANCH }}`.
          
            ${{ steps.workflow_msg.outputs.message }}

          commit-message: |
            Update Moodle to ${{ steps.latest_tag.outputs.latest_tag }}

          assignees: ${{ inputs.assignees }}
          reviewers: ${{ inputs.reviewers }}

          labels: |
            moodle-core
            ${{ steps.merge.outputs.workflow_changed == 'true' && 'upstream-workflow-change' || '' }}
