name: Reusable Moodle Release Sync

on:
  workflow_call:
    inputs:
      upstream_branch:
        required: true
        type: string
      target_branch:
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream + fetch tags
        run: |
          git remote add upstream https://github.com/moodle/moodle.git
          git fetch upstream --tags

      - name: Derive allowed version prefix
        id: version
        run: |
          RAW=$(echo "$UPSTREAM_BRANCH" | sed -E 's/MOODLE_([0-9]{3})_STABLE/\1/')
          MAJOR=$(echo "$RAW" | cut -c1)
          MINOR=$(echo "$RAW" | cut -c2-3 | sed 's/^0//')

          PREFIX="v${MAJOR}.${MINOR}."
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "Allowed prefix: $PREFIX"

      - name: Find latest valid tag on branch
        id: latest_tag
        run: |
          PREFIX=${{ steps.version.outputs.prefix }}

          TAG=$(git tag \
            --merged upstream/$UPSTREAM_BRANCH \
            --list "${PREFIX}*" \
            --sort=-v:refname | head -n 1)

          if [ -z "$TAG" ]; then
            echo "No matching tag found!" >&2
            exit 1
          fi

          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Verify tag is on branch
        run: |
          TAG=${{ steps.latest_tag.outputs.latest_tag }}

          if ! git merge-base --is-ancestor "$TAG" "upstream/$UPSTREAM_BRANCH"; then
            echo "Tag $TAG is NOT on $UPSTREAM_BRANCH" >&2
            exit 1
          fi

      - name: Check if already merged
        id: check
        run: |
          git checkout $TARGET_BRANCH
          TAG=${{ steps.latest_tag.outputs.latest_tag }}

          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "already_merged=true" >> $GITHUB_OUTPUT
          else
            echo "already_merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch
        if: steps.check.outputs.already_merged == 'false'
        run: |
          TAG=${{ steps.latest_tag.outputs.latest_tag }}

          git checkout -b sync-$TAG || git checkout sync-$TAG
          git merge $TAG --no-edit || echo "Merge conflicts"

      - name: Push branch
        if: steps.check.outputs.already_merged == 'false'
        run: |
          TAG=${{ steps.latest_tag.outputs.latest_tag }}
          git push origin sync-$TAG --force

      - name: Create Pull Request
        if: steps.check.outputs.already_merged == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync-${{ steps.latest_tag.outputs.latest_tag }}
          base: ${{ env.TARGET_BRANCH }}
          title: "Sync Moodle ${{ steps.latest_tag.outputs.latest_tag }}"
          body: |
            Automated merge of upstream tag `${{ steps.latest_tag.outputs.latest_tag }}`
            from `${{ env.UPSTREAM_BRANCH }}` into `${{ env.TARGET_BRANCH }}`.